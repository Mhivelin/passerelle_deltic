{% if not liste_zeendoc_classeur %}
<p>La connexion à Zeendoc n'est pas configurée</p>
{% else %}
<label for="LibChamp_{{ field.IdChamp }}">{{ field.LibChamp }}</label>
<select
  class="form-control"
  id="LibChamp_{{ field.IdChamp }}"
  name="LibChamp[]"
>
  {% for classeur in liste_zeendoc_classeur %} {% if field.Valeur ==
  classeur.Coll_Id %}
  <option value="{{ classeur.Coll_Id }}" selected>{{ classeur.Label }}</option>
  {% else %}
  <option value="{{ classeur.Coll_Id }}">{{ classeur.Label }}</option>
  {% endif %} {% endfor %}
</select>
{% endif %}
